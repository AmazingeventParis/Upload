<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Tool — Code Server</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            padding: 24px;
            text-align: center;
            border-bottom: 1px solid #21262d;
            width: 100%;
        }
        .header h1 { font-size: 20px; color: #58a6ff; }
        .header p { font-size: 13px; color: #8b949e; margin-top: 4px; }

        /* Login */
        .login-container {
            margin-top: 80px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px;
            width: 360px;
        }
        .login-container h2 { font-size: 16px; margin-bottom: 16px; text-align: center; }
        .login-input {
            width: 100%;
            padding: 10px 14px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #e6edf3;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .login-input:focus { outline: none; border-color: #58a6ff; }
        .login-btn {
            width: 100%;
            padding: 10px;
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-btn:hover { background: #2ea043; }
        .login-error { color: #f85149; font-size: 12px; margin-top: 8px; display: none; }

        /* Main */
        .main { width: 100%; max-width: 800px; padding: 24px; display: none; }

        /* Drop zone */
        .drop-zone {
            border: 2px dashed #30363d;
            border-radius: 12px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #161b22;
        }
        .drop-zone:hover, .drop-zone.drag-over {
            border-color: #58a6ff;
            background: #1a2332;
        }
        .drop-zone-icon { font-size: 48px; margin-bottom: 12px; }
        .drop-zone-text { font-size: 15px; color: #8b949e; }
        .drop-zone-text strong { color: #58a6ff; }
        .drop-zone-sub { font-size: 12px; color: #484f58; margin-top: 8px; }

        input[type="file"] { display: none; }

        /* Upload progress */
        .upload-item {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 14px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .upload-item .icon { font-size: 24px; }
        .upload-item .info { flex: 1; }
        .upload-item .name { font-size: 13px; font-weight: 600; }
        .upload-item .size { font-size: 11px; color: #8b949e; }
        .upload-item .status { font-size: 12px; margin-top: 4px; }
        .upload-item .status.uploading { color: #d29922; }
        .upload-item .status.done { color: #3fb950; }
        .upload-item .status.error { color: #f85149; }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #21262d;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: #58a6ff;
            border-radius: 2px;
            transition: width 0.3s;
            width: 0%;
        }

        /* Command box */
        .cmd-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 12px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cmd-box code {
            flex: 1;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 11px;
            color: #79c0ff;
            word-break: break-all;
        }
        .cmd-box .copy-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
        }
        .cmd-box .copy-btn:hover { color: #e6edf3; border-color: #58a6ff; }
        .cmd-box .copy-btn.copied { color: #3fb950; border-color: #3fb950; }

        /* Files list */
        .section-title {
            font-size: 14px;
            color: #8b949e;
            margin-top: 32px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #21262d;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .file-item .fname { flex: 1; color: #79c0ff; word-break: break-all; }
        .file-item .fsize { color: #8b949e; font-size: 11px; }
        .file-item .fdelete {
            color: #484f58;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .file-item .fdelete:hover { color: #f85149; background: #1a0000; }
        .empty-msg { color: #484f58; font-size: 13px; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<!-- Login -->
<div id="login-screen" class="login-container">
    <h2>Upload Tool</h2>
    <input type="password" id="password-input" class="login-input" placeholder="Mot de passe" autofocus>
    <button class="login-btn" onclick="login()">Connexion</button>
    <div id="login-error" class="login-error">Mot de passe incorrect</div>
</div>

<!-- Main app -->
<div id="main-app" class="main">
    <div class="header">
        <h1>Upload Tool</h1>
        <p>Glissez-deposez vos fichiers — ils apparaissent directement dans code-server</p>
    </div>

    <!-- Drop zone -->
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="drop-zone-icon">📁</div>
        <div class="drop-zone-text"><strong>Glissez-deposez</strong> vos fichiers ici</div>
        <div class="drop-zone-sub">ou cliquez pour parcourir — Max 50 MB par fichier</div>
    </div>
    <input type="file" id="file-input" multiple>

    <!-- Upload list -->
    <div id="upload-list"></div>

    <!-- Recent files -->
    <div class="section-title">Fichiers recents</div>
    <div id="files-list"><div class="empty-msg">Aucun fichier</div></div>
</div>

<script>
const PASSWORD_KEY = 'upload_password';
let password = localStorage.getItem(PASSWORD_KEY) || '';

// --- Auth ---
function login() {
    password = document.getElementById('password-input').value;
    testAuth().then(ok => {
        if (ok) {
            localStorage.setItem(PASSWORD_KEY, password);
            showApp();
        } else {
            document.getElementById('login-error').style.display = 'block';
        }
    });
}

async function testAuth() {
    try {
        const r = await fetch('/api/files', { headers: { 'X-Upload-Password': password } });
        return r.ok;
    } catch { return false; }
}

function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    loadFiles();
}

// Auto-login si mot de passe sauvegarde
if (password) {
    testAuth().then(ok => { if (ok) showApp(); });
}

document.getElementById('password-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
});

// --- Drop zone ---
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

['dragenter', 'dragover'].forEach(ev => {
    dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
});
['dragleave', 'drop'].forEach(ev => {
    dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('drag-over'); });
});

dropZone.addEventListener('drop', e => {
    const files = e.dataTransfer.files;
    uploadFiles(files);
});

fileInput.addEventListener('change', e => {
    uploadFiles(e.target.files);
    fileInput.value = '';
});

// --- Upload ---
async function uploadFiles(files) {
    for (const file of files) {
        await uploadOne(file);
    }
    loadFiles();
}

async function uploadOne(file) {
    const id = 'up-' + Date.now() + Math.random().toString(36).slice(2,6);
    const ext = file.name.split('.').pop().toLowerCase();
    const icons = { png: '🖼️', jpg: '🖼️', jpeg: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️',
                    pdf: '📄', xlsx: '📊', xls: '📊', csv: '📊', doc: '📝', docx: '📝',
                    zip: '📦', rar: '📦', '7z': '📦', mp4: '🎬', mp3: '🎵' };
    const icon = icons[ext] || '📎';
    const sizeStr = file.size > 1024*1024 ? (file.size/1024/1024).toFixed(1) + ' MB' : (file.size/1024).toFixed(0) + ' KB';

    const html = `
        <div class="upload-item" id="${id}">
            <div class="icon">${icon}</div>
            <div class="info">
                <div class="name">${file.name}</div>
                <div class="size">${sizeStr}</div>
                <div class="status uploading">Upload en cours...</div>
                <div class="progress-bar"><div class="progress-bar-fill" id="${id}-bar"></div></div>
            </div>
        </div>`;
    document.getElementById('upload-list').insertAdjacentHTML('afterbegin', html);

    const formData = new FormData();
    formData.append('file', file);
    formData.append('password', password);

    try {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/upload');
        xhr.setRequestHeader('X-Upload-Password', password);

        xhr.upload.onprogress = e => {
            if (e.lengthComputable) {
                const pct = (e.loaded / e.total * 100).toFixed(0);
                document.getElementById(id + '-bar').style.width = pct + '%';
            }
        };

        const result = await new Promise((resolve, reject) => {
            xhr.onload = () => {
                if (xhr.status === 200) resolve(JSON.parse(xhr.responseText));
                else reject(JSON.parse(xhr.responseText));
            };
            xhr.onerror = () => reject({ error: 'Erreur reseau' });
            xhr.send(formData);
        });

        const el = document.getElementById(id);
        const statusEl = el.querySelector('.status');
        statusEl.className = 'status done';
        statusEl.textContent = 'Disponible dans code-server !';

        // Afficher le chemin pour Claude
        const pathHtml = `
            <div class="cmd-box">
                <code>~/projects/uploads/${result.filename}</code>
                <button class="copy-btn" onclick="copyCmd(this)">Copier</button>
            </div>`;
        el.querySelector('.info').insertAdjacentHTML('beforeend', pathHtml);

    } catch (err) {
        const el = document.getElementById(id);
        const statusEl = el.querySelector('.status');
        statusEl.className = 'status error';
        statusEl.textContent = err.error || 'Erreur upload';
    }
}

function copyCmd(btn) {
    const code = btn.parentElement.querySelector('code').textContent;
    navigator.clipboard.writeText(code);
    btn.textContent = 'Copie !';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copier'; btn.classList.remove('copied'); }, 2000);
}

// --- File list ---
async function loadFiles() {
    try {
        const r = await fetch('/api/files', { headers: { 'X-Upload-Password': password } });
        const data = await r.json();
        const container = document.getElementById('files-list');

        if (!data.files || data.files.length === 0) {
            container.innerHTML = '<div class="empty-msg">Aucun fichier</div>';
            return;
        }

        container.innerHTML = data.files.map(f => {
            const sizeStr = f.size > 1024*1024 ? (f.size/1024/1024).toFixed(1) + ' MB' : (f.size/1024).toFixed(0) + ' KB';
            return `<div class="file-item">
                <span class="fname">${f.name}</span>
                <span class="fsize">${sizeStr}</span>
                <span class="fdelete" onclick="deleteFile('${f.name}', this)" title="Supprimer">✕</span>
            </div>`;
        }).join('');
    } catch {}
}

async function deleteFile(name, el) {
    if (!confirm('Supprimer ' + name + ' ?')) return;
    await fetch('/api/delete/' + name, {
        method: 'DELETE',
        headers: { 'X-Upload-Password': password }
    });
    el.closest('.file-item').remove();
}
</script>
</body>
</html>
